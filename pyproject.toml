[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pbremaster"
version = "0.1.0"
description = "A modern remaster of Microsoft Pandora's Box that runs on the original game files"
authors = [{ name = "Mike Hellyer" }]
requires-python = ">=3.12"
dependencies = ["pygame-ce>=2.5", "numpy", "pefile>=2023.2.7"]

[project.optional-dependencies]
tools = ["Pillow>=10.1", "capstone>=5"]
dev = ["Pillow>=10.1", "capstone>=5", "pytest"]

[project.scripts]
pbremaster = "pbremaster.ui.app:main"
pb-extract = "pbremaster.tools.extract:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
